
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astracompass"
version = "0.1.0"
description = "A modular framework for evaluating, training, and improving large language models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Irena Popova" }
]
keywords = [
    "llm",
    "large-language-models",
    "evaluation",
    "model-training",
    "fine-tuning",
    "semantic-analysis",
    "model-adaptation",
    "machine-learning",
    "artificial-intelligence"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/irenapopova/astra"
Repository = "https://github.com/irenapopova/astra"
Issues = "https://github.com/irenapopova/astra/issues"

[tool.setuptools.packages.find]
where = ["src"]
