
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-model-lab"
version = "0.1.0"
description = "A framework for evaluating, training, and adapting large language models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Irena Popova" }
]
keywords = [
    "llm",
    "evaluation",
    "fine-tuning",
    "machine-learning",
    "artificial-intelligence"
]

[project.urls]
Homepage = "https://github.com/irenapopova/astra"
Repository = "https://github.com/irenapopova/astra"

[tool.setuptools.packages.find]
where = ["src"]
